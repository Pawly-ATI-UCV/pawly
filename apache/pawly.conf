# Sitio de Pawly en Apache
ServerName localhost

<VirtualHost *:80>
    # Apache recibe las peticiones HTTP y mod_wsgi se las pasa a Django
    WSGIDaemonProcess pawly python-path=/app
    WSGIProcessGroup pawly
    WSGIScriptAlias / /app/configPawly/wsgi.py

    <Directory /app/configPawly>
        <Files wsgi.py>
            Require all granted
        </Files>
    </Directory>

    # Apache sirve directamente los archivos estáticos y las fotos
    Alias /static/ /app/static_root/
    <Directory /app/static_root>
        Require all granted
    </Directory>

    Alias /media/ /app/media/
    <Directory /app/media>
        Require all granted
    </Directory>

    # Los registros salen en docker compose logs
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
