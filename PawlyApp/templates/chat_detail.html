{% extends "base_app.html" %}
{% load static i18n %}

{% block content %}
    <div class="chat-layout">
      <section class="chat-list desktop-only--flex" aria-labelledby="chat-list-title">
        <div class="section-head">
          <h2 class="title-2" id="chat-list-title">{% trans "Mensajes" %}</h2>
          <a class="icon-btn icon-btn--bordered" href="{% url 'search' %}" aria-label="{% trans 'Nueva conversación' %}"><svg class="icon" aria-hidden="true"><use href="{% static 'img/icons/edit.svg' %}#icon"/></svg></a>
        </div>
        <form class="search-box search-box--page" action="{% url 'chat_list' %}" role="search" aria-label="{% trans 'Buscar conversación' %}">
          <svg class="icon icon--sm" aria-hidden="true"><use href="{% static 'img/icons/search.svg' %}#icon"/></svg>
          <label class="visually-hidden" for="chat-search">{% trans "Buscar conversación" %}</label>
          <input id="chat-search" name="q" type="search" placeholder="{% trans 'Buscar conversación' %}">
        </form>


        <h3 class="eyebrow">{% trans "Chats" %}</h3>
        {% include "chat_items.html" %}
      </section>
      <section class="chat-panel" aria-labelledby="chat-title">
        {% include "chat_conversation.html" with heading="h1" %}
      </section>
    </div>
{% endblock %}
